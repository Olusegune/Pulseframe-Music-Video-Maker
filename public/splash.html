<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PULSEFRAME</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; cursor: default; user-select: none; }
  img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; animation: in 450ms cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: scale(1.02) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { img { animation: none; opacity: 1 } }
</style>
</head>
<body>
<img src="splash.jpg" alt="PULSEFRAME — Direct music into motion." draggable="false" />
</body>
</html>
